
name: Python CI-CD Pipeline

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CI: Install dependencies, lint and test
  test:
    name: Test Python Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest ruff

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

  # Build and publish only after tests pass on main
  build:
    name: Build and Push Docker Image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sireeshahub1802/python:${{ github.sha }} .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push versioned image
        run: docker push sireeshahub1802/python:${{ github.sha }}

  # CD: Wait for production approval
  deploy-production:
    name: Deploy to Production
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Deploy application
        run: |
          echo "Production approval received."
          echo "Deploy image sireeshahub1802/python:${GITHUB_SHA}"
          echo "Replace this step with your actual deployment commands."
